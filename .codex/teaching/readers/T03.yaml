  at: ../../../dev-log/tools/03-check-and-progress.md#tool-navigation
  establishes: 内容成立后再查导航；同一声明支撑入口、路线位置与 current 的区别，真实失败输入保护旧文件，差异块身份只负责固定覆盖范围。

