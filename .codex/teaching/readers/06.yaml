checkpoint: '06'
baseline: baseline.yaml
start: '05'
current_operation: 建立入口栈并发送第一行文字
already_explained:
- concept: 串口与字符编码
  at: ../../../dev-log/core/04-format.md#serial-model
  establishes: 设备按顺序收发字节；QEMU 接到主机输出；整数需转换成 ASCII 字符才显示为数字
- concept: 容量与格式参数
  at: ../../../dev-log/core/04-format.md#format-capacity
  establishes: 数组容量包含 NUL，返回长度计算完整字符数；格式决定可变参数的取值类型
- concept: 启动结构与ABI
  at: ../../../dev-log/core/05-boot-contract.md#boot-layout
  establishes: 适配层与内核按同一固定字段布局读写启动数据，头文件声明这份布局和验证接口
first_use:
- concept: UART 发送通路
  at: ../../../dev-log/core/06-entry.md#serial-path
  establishes: 内核文字经 UART 到 QEMU，再到主机文件；主机日志文件不是 guest 文件系统
- concept: I/O 端口、CPU 寄存器与内联汇编
  at: ../../../dev-log/core/06-entry.md#port-registers
  establishes: AL 保存字节，DX 保存端口；设备寄存器与 CPU 寄存器不同；约束交代汇编的输入输出
- concept: 轮询和提交状态
  at: ../../../dev-log/core/06-entry.md#polling
  establishes: 发送前反复检查可接收状态；尝试次数不等于时间，状态位不证明主机已显示
- concept: ELF 入口与栈
  at: ../../../dev-log/core/06-entry.md#entry-stack
  establishes: ELF入口指向_start；引导器已有初始栈，入口再切到内核持有的64KiB BSS栈，RSP下降后写入，lea仅计算位置
- concept: C 调用约定
  at: ../../../dev-log/core/06-entry.md#call-abi
  establishes: call 压入返回地址；入口满足对齐和方向标志，C 调用依赖这些前提
- concept: 节、段与链接
  at: ../../../dev-log/core/06-entry.md#elf-layout
  establishes: 节组织输入代码数据，装载段指导加载；链接脚本给符号与入口安排地址
- concept: 构建依赖与独立运行选项
  at: ../../../dev-log/core/06-entry.md#make-rules
  establishes: Make 根据目标与依赖时间决定重编译，模式变量定位输入输出；freestanding 与自有运行时排除宿主启动服务
- concept: 静态协议记录的构建和写回
  at: ../../../dev-log/core/06-entry.md#limine-revision
  establishes: 编译与链接保留起止标记和修订数组，Limine装载后将受支持的第三项写零，C入口才检查；12.9.2发布版本与基础修订6不同
borrowed:
- component: Limine 与固定协议头
  contract: 进入内核前完成装载与早期映射，填写协议状态；本节入口自己准备栈并访问 COM1。
not_inferred: 解释位置、敲完与运行成功不证明真实读者已掌握；作者必须读取所引用段落确认成立范围。
source_reading:
- concept: 汇编位置、栈对齐与符号
  at: ../../../dev-log/core/06-entry.md#code-kernel-arch-x86-64-entry-s-1
  establishes: 标签给地址，.size 的当前位置差给长度；RIP 相对形成自有栈顶地址，call 压入返回地址后满足 C 入口对齐
- concept: 当前编译单元中的static inline函数
  at: ../../../dev-log/core/06-entry.md#port-registers
  establishes: serial.c中的static限制out8/in8仅由当前单元按名字引用；放入头文件时才由每个包含者取得内部定义，inline不保证机器码一定展开
