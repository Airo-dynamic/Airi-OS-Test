feedback:
- source: 作者全文顺读，响应用户对主线和语言的反馈
  observation: 主机参考与真实内核之间的环境切换需要显式说明。
  revision: 从K13保留的内核文本循环接入共享绘图，解释live数据、串口回退和完成标记。
- source: v2 独立源码伴读与连续复敲
  observation: 仪表台曾保存局部console地址，且切换console时没有重新安装主题扩展。
  revision: 仪表台console改为静态；新console或同地址重置后失效的extension_context都会重建桌面并绑定扩展，绑定不变的后续帧保留窗口与主题；G26增加换会话后的双主题像素观察。
