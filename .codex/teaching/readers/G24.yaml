already_explained:
- concept: 启动信息的复制与借用
  at: ../../../dev-log/core/08-real-boot-info.md#boot-lifetimes
  establishes: 固定数组复制元数据，帧缓冲地址仍借用原像素；静态描述持续有效，使用地址依赖原映射
- concept: 主机管道到 guest 输入
  at: ../../../dev-log/core/10-input.md#uart-input-path
  establishes: 父进程写字节到 QEMU 标准输入，QEMU 交给 UART，内核积累命令并回送结果
- concept: 绘图顺序与裁剪
  at: ../../../dev-log/graphics/15-windows.md#paint-order
  establishes: 后写覆盖前写；order 表示底到顶；应用绘图借用 body 裁剪，返回后恢复整屏
- concept: 画布与图像寿命
  at: ../../../dev-log/graphics/23-native-window.md#display-lifetime
  establishes: 平台拥有 pixels，图像包装在同步显示期读取；先释放包装，尺寸改变才换数组
- concept: 串口和可选图形的链接选择
  at: ../../../dev-log/core/11-serial-build.md#serial-display-link
  establishes: 入口调用同名airi_console_draw；串口实现返回false，desktop-配置选择图形实现，首帧返回后才发布READY。
first_use:
- concept: 共享源码与真实服务
  at: ../../../dev-log/graphics/24-guest-display.md#guest-services
  establishes: 主机与 guest 分别运行各自编译副本；live 使用实际 boot/console，不取得 reference 文件
- concept: 首帧完成记录
  at: ../../../dev-log/graphics/24-guest-display.md#frame-completion
  establishes: 先完成图形处理再发布 READY；无图形继续串口，graphics 值说明实际结果
- concept: 新文本会话重新绑定，后续帧保留状态
  at: ../../../dev-log/graphics/24-guest-display.md#guest-services
  establishes: 首次有效绘图、console地址改变，或同地址重置使extension_context不再指向desktop时，ui_init重建并装主题扩展；对象与绑定都未变才复用后续帧。dashboard console有静态寿命。
