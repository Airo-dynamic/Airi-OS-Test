checkpoint: '02'
baseline: baseline.yaml
start: '01'
current_operation: 取得固定的引导器、协议头和固件
already_explained:
- concept: 路径对象与交叉工具
  at: ../../../dev-log/01-tools.md#tool-paths
  establishes: ROOT 从源码位置取得；Path 的 / 拼接路径；LLVM 工具为 guest 生成代码，HOST_CC 构建主机程序
- concept: 进程、环境变量和搜索结果
  at: ../../../dev-log/00-first-tool.md#tool-process
  establishes: 可执行文件与一次运行不同；PATH 搜索返回路径字符串或 None；异常把失败交回入口
first_use:
- concept: 固件、引导器与协议头
  at: ../../../dev-log/02-dependencies.md#boot-materials
  establishes: 虚拟CPU从固件开始执行；OVMF按UEFI约定启动Limine，后者装载内核并留下交接数据，limine.h只提供编译时布局和常量
- concept: 配置中的嵌套对象
  at: ../../../dev-log/02-dependencies.md#config-values
  establishes: JSON 对象转为字典、数组转为列表；按键和下标逐层取得实际值与摘要
- concept: 缓存判定与归档展开
  at: ../../../dev-log/02-dependencies.md#archive-preparation
  establishes: dep取自lock的limine记录，url/归档路径/归档摘要传入download；同一BOOTX64.EFI从files缓存检查接到真实归档成员解包，items/or/any/切片与展开服务这条路径
- concept: 可取得的固定固件与有界准备过程
  at: ../../../dev-log/02-dependencies.md#firmware-inputs
  establishes: curl取得v11.1.2压缩映像，bzip2展开后先按锁文件核对再进入正式缓存；独立sh -eu使失败停止后续准备
borrowed:
- component: Limine、协议头与 OVMF
  contract: 从QEMU固定标签取得固件并按既有锁文件核对；Limine及协议头仍由prepare准备
not_inferred: 解释位置、敲完与运行成功不证明真实读者已掌握；作者必须读取所引用段落确认成立范围。
source_reading:
- concept: 真实材料与下载参数
  at: ../../../dev-log/02-dependencies.md#code-scripts-deps-py-4
  establishes: lock转为外层字典，dep取Limine内层记录；同一记录的URL与摘要配合ROOT下归档路径交给download，返回后归档才合格
- concept: 固件候选与缓存
  at: ../../../dev-log/02-dependencies.md#firmware-cache
  establishes: firmware列表逐项形成target；先验缓存，next再取存在且摘要匹配的首个来源，复制到工程缓存；vars的启动副本与初值分开
- concept: 文件字节与摘要
  at: ../../../dev-log/02-dependencies.md#code-scripts-deps-py-2
  establishes: read_bytes 返回 bytes，sha256 消费完整文件字节并产生十六进制摘要
- concept: 临时下载与正式缓存
  at: ../../../dev-log/02-dependencies.md#code-scripts-deps-py-3
  establishes: curl 先将材料写入临时路径，重新读取其字节核对摘要；匹配后 replace 才把这份文件放入正式缓存
