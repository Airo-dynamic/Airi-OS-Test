feedback:
- source: 作者全文顺读，响应用户对主线和语言的反馈
  observation: 摘要、下载、解包与固件寻找各自列出，输入与消费者关系不够清楚。
  revision: 沿一份尚未缓存的 Limine 归档追踪临时文件、摘要检查、正式缓存和展开。
- source: 2026-10-15主线迁移审查
  observation: 锁文件含字体身份，容易误以为串口主线也需要准备字体。
  revision: 保留实现字节和现有下载流程，只说明字体字段由可选图形支线消费。
not_inferred: 解释位置、敲完与运行成功不证明真实读者已掌握；作者必须读取所引用段落确认成立范围。
