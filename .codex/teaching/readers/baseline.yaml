reader_stated:
  education: 本科毕业，分布式存储实习
  experience:
  - C++ 仿 muduo 网络库及 Raft
  - C 子集编译器
  - Java SpringBoot、React Electron 全栈
  - C++ CUDA 流体仿真
  python: 对容器、路径和进程接口需要就地解释；不从个别追问推定整门语言能力
preferences:
- 连续段落与完整语义块，不逐句碎切
- 当前必需背景在正文展开
- 完整源码逐字符带敲，包括构建与验证
- 无自测、留题、评分或掌握度门槛
not_assumed:
- 汇编、调用约定、引导固件、页表、设备访问
- Python 容器、路径库、生成器、异常和进程接口
- Make 的目标、自动变量与续行；Shell 引用、命令替换和 heredoc
- C 指针跨度、容量与 NUL、回调参数；Objective-C 消息和图像资源寿命
feedback:
- observation: 旧教程需要先复制成品再重写函数，且把运行通过当成学习完成
  revision: 从空目录按代码块重建检查点；资料不记录已掌握
- observation: 基础对象身份和数据形状需要聊天补课
  revision: 首次用实际值解释来源、转换、消费者与生命周期
- observation: 文档组织和语言存在严重问题，违反 log-polish，缺少主线叙事
  revision: 先按具体操作与知识依赖组织正文，再核对对象交接，最后全文润色；覆盖完整与运行成功不作为叙事质量依据
- source: 用户本会话
  observation: 串口从未解释，画像未良好生效，正文缺少场景与主线
  revision: 画像记录实际操作、具体解释位置和已建立范围；承接前读正文，按同一输入串联代码与结果
- source: 用户本轮要求
  observation: 零散语法解释远离敲写位置，源码伴读未纳入验收。
  revision: 有效语句旁注贴近实际对象，正文保留跨行机制；画像按具体代码单元记录首次解释，而非推断掌握。

