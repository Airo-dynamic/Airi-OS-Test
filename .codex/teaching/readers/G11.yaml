checkpoint: G11
baseline: baseline.yaml
start: K11
current_operation: 把主机数组按真实布局变成矩形、裁剪线段与PPM
already_explained:
- concept: 帧缓冲与借用地址
  at: ../../../dev-log/core/05-boot-contract.md#boot-layout
  establishes: 固定描述保存地址与布局，复制描述不复制像素；调用方须提供有效可写映射
- concept: 字符输入与串口输出
  at: ../../../dev-log/core/10-input.md#uart-input-path
  establishes: 父进程向QEMU输入管道写命令字节，UART轮询交给同一console；结果仍从UART发送，图形另取像素输出路径。
first_use:
- concept: 半开几何与裁剪
  at: ../../../dev-log/graphics/11-pixels.md#pixel-canvas
  establishes: 实际{20,20,280,160}包含列20至299，绘制范围与允许范围分别求交
- concept: pitch、通道位域与端序
  at: ../../../dev-log/graphics/11-pixels.md#pixel-pitch
  establishes: base+row*pitch+col*bytes定位数组，设备布局与PPM通道排列分别处理
- concept: 整数线段与同轮误差
  at: ../../../dev-log/graphics/11-pixels.md#code-frontend-render-draw-c-2
  establishes: 两轴独立使用旧twice，(0,0)至(3,2)的四点演算解释对角步
- concept: 指针对齐与volatile
  at: ../../../dev-log/graphics/11-pixels.md#code-frontend-render-draw-c-1
  establishes: 地址低两位为0才按uint32_t写；否则按字节写，行距包含填充
- concept: 文件短写与关闭
  at: ../../../dev-log/graphics/11-pixels.md#code-labs-tutorial-pixels-c-1
  establishes: PPM每像素三字节，任意短写停止输出但仍关闭，成功才报告文件完成
- concept: 同一画布从借用到文件输出
  at: ../../../dev-log/graphics/11-pixels.md#code-labs-tutorial-pixels-c-1
  establishes: u_begin借用主机canvas与pixels，先背景再局部裁剪并画图，恢复整屏后画边框，save_image读取同一数组输出PPM；描述与数组覆盖全部调用。
borrowed: []
