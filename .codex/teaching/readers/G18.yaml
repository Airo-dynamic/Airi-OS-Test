checkpoint: G18
baseline: baseline.yaml
start: G17
current_operation: 保留未保存main.lua与选区，Settings切Day/Night；查看同一参考任务和资源快照
already_explained:
- concept: 修改前校验、重叠移动与单步撤销
  at: ../../../dev-log/graphics/17-editing.md#edit-transaction
  establishes: 先验证输入与最终容量，后保存undo、删除选区、搬含NUL尾部、复制；ABCD在2插xy得到ABxyCD。
first_use:
- concept: 同次任务快照与会话偏好
  at: ../../../dev-log/graphics/18-applications.md#task-samples
  establishes: tasks(context,s->tasks,16,&s->stats)复制记录与统计，初始pid14在快照下标2；theme和文档继续由原desktop持有
- concept: 桌面主题与同步命令消费者
  at: ../../../dev-log/graphics/18-applications.md#theme-owner
  establishes: desktop.theme拥有Night/Day偏好；Settings和同步主题命令消费者修改它，不重建桌面或修改文档。
- concept: 任务记录与60点百分数快照
  at: ../../../dev-log/graphics/18-applications.md#task-samples
  establishes: reference的pid与sample来自固定记录，不是宿主进程或QEMU实测；60点横轴59间隔，0..100映射图底到图顶。
- concept: 快照有效性、单位与布局扣除
  at: ../../../dev-log/graphics/18-applications.md#resource-sidebar
  establishes: stats.available说明本次后端确已提供统计；reference数据仍是Recorded session示例。monitor且宽度>=1120才预留268px；KiB/1024得到MiB。
- concept: 主题切换时独立比较文档、保存点、选择与窗口
  at: ../../../dev-log/graphics/18-applications.md#code-labs-tutorial-theme-c-1
  establishes: 复制editor/saved/windows后直接送入Settings按钮坐标；检查cursor/anchor/selection/dirty，字段focus可按分派清除，不推定保持。
- concept: 应用接口随实际消费者增长
  at: ../../../dev-log/graphics/18-applications.md#code-frontend-apps-internal-h-1
  establishes: Tasks/Settings绘图与Settings内容点击现在都有实际消费者，原生窗口路由仍未接入。
- concept: 真实按钮矩形与空白区域
  at: ../../../dev-log/graphics/18-applications.md#code-labs-tutorial-theme-c-1
  establishes: Night/Day和密度都逐矩形命中；密度gap/右侧blank保持0，Compact到1，Comfortable回0，文档与窗口仍保留。
borrowed:
- component: G12生成的八套字体数据
  usage: 按fonts.lock.json固定来源和轴，font_atlas.py生成字形覆盖率，u_text借用只读数组；前端不是新的字体引擎。
feedback:
- source: B13 连续正文与增量编辑复核
  observation: 新任务来源在整份头文件之后才解释，多个小接入藏在数百行旧代码重贴中
  revision: 先区分会话偏好与服务快照，用实际tasks实参和pid14连接记录与消费者；局部更新服务、paint和键盘，并区分PPM独立进程与同进程状态观察
- source: 用户本轮连续教程要求
  observation: 基础语法、对象来源与状态寿命不能只由作者假设，界面应直接从新版设计逐步形成。
  revision: 本章按同一个具体操作承接，旁注解释当前值与局部表达式，正文追踪跨函数状态；共享字段在实际消费者出现时加入。
not_inferred: 已生成文档、运行观察通过、注释覆盖或前文已解释都不记录为已掌握；共享画像明确经历与本章解释范围分别维护。
