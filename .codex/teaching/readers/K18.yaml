checkpoint: K18
baseline: baseline.yaml
start: K17 + L02
current_operation: PIT周期经IRQ0和PIC交付向量32，C增加ticks并EOI，iretq继续hlt后的循环，等待基准后至少五次处理
already_explained:
- concept: 完整异常现场
  at: ../../../dev-log/core/14-exceptions.md#trap-entry
  establishes: 保存全部GPR并对齐调用C，iretq恢复原现场
first_use:
- concept: IRQ线、向量和IF
  at: ../../../dev-log/core/18-timer.md#pit-pic-route
  establishes: PIT独立计数，IRQ0传设备请求，PIC应答提供向量32供CPU查IDT；设备配置、控制器掩码和CPU的IF分别生效；固定单核兼容路线清IA32_APIC_BASE全局使能，遇x2APIC拒绝
- concept: PIC ICW、掩码、EOI和PIT分频
  at: ../../../dev-log/core/18-timer.md#timer-config
  establishes: 两PIC先屏蔽，再按ICW1至4声明模式/基址/级联/软件EOI；PIT端口接11931低高字节，清ticks后仅开IRQ0并最后sti；处理函数计数后向主片EOI，普通代码读取volatile差值，周期事件弥补检查与hlt间到达但不保证精确五次或墙钟时间
- concept: PIC与PIT控制字的字段编码
  at: ../../../dev-log/core/18-timer.md#timer-control-words
  establishes: ICW1的初始化位与IC4合成0x11，SNGL与LTIM为零选择级联和边沿；PIT按SC00/RW11/Mode010/BCD0合成0x34，11931拆成低0x9b和高0x2e，再按RW约定组成0x2e9b
- concept: 设备向量复用异常现场
  at: ../../../dev-log/core/18-timer.md#timer-entry
  establishes: PIC编号用于IDT选门，TRAP32另把编号压进现场；专用IDT32进入原公共保存，C在故障报告前计数返回，EOI确认PIC而iretq恢复寄存器与IF，不修改RIP或切任务
- concept: 屏蔽故障与有界拒绝
  at: ../../../dev-log/core/18-timer.md#masked-timer
  establishes: 掩码0xff保留PIT及IF却阻止IRQ0交付，ticks不增而hlt停住；本轮配置标记和35秒超时共同成立才接受预期故障，finally回收QEMU，UEFI未到驱动属于另一处失败
not_assumed:
- 任务切换、用户态抢占、等待队列、APIC路由和SMP
limits:
- 固定单核q35兼容PIC时钟，非Linux现代时钟实现
- 运行不记录为读者掌握
