checkpoint: G17
baseline: baseline.yaml
start: G16
current_operation: 替换main.lua为print(42)加换行，撤销、恢复、保存并观察执行未连接失败
already_explained:
- concept: 可见行、快照下标与文件身份
  at: ../../../dev-log/graphics/16-files-editor-view.md#file-indices
  establishes: 默认order=[3,2,0,5,1,4]；order[0]=3取files[3]，再按该项id读取，索引排序不搬动元信息。
- concept: 工作正文与保存点
  at: ../../../dev-log/graphics/16-files-editor-view.md#document-copies
  establishes: read复制正文到editor和独立saved；编辑工作数组不会自动修改服务记录，dirty比较两份内容。
first_use:
- concept: 修改前校验、重叠移动与单步撤销
  at: ../../../dev-log/graphics/17-editing.md#edit-transaction
  establishes: 先验证输入与最终容量，后保存undo、删除选区、搬含NUL尾部、复制；ABCD在2插xy得到ABxyCD。
- concept: 保存成功后更新提交点与失败保留
  at: ../../../dev-log/graphics/17-editing.md#save-transition
  establishes: 仅服务true时刷新、复制saved、清dirty；失败保留editor与saved差异。pending_close在成功或失败出口消耗。
- concept: 局部错误数组转为持久反馈副本
  at: ../../../dev-log/graphics/17-editing.md#dialog-lifetime
  establishes: dialog_title/text/input复制入desktop，局部error寿命结束后下一帧仍读取独立数组；错误框最后盖过窗口。
- concept: 按实际正文裁剪显露光标
  at: ../../../dev-log/graphics/17-editing.md#code-frontend-core-editing-c-3
  establishes: u_window_body先去48px标题及边框；高度扣88px正文起点和30px裁剪，宽度按项目栏与72px行号边距计算。800×400窗口十行输入与400px宽31个A均用实际19px竖线观察。
- concept: 按键接收者、字段输入与多行输入
  at: ../../../dev-log/graphics/17-editing.md#key-routing
  establishes: 先判断dialog/focus/active；同一个键仅送当前接收者。UI_SAVE_KEY不是字符S，先选择操作语义再修改状态。
- concept: 应用接口随实际消费者增长
  at: ../../../dev-log/graphics/17-editing.md#code-frontend-apps-internal-h-1
  establishes: 错误框首次持有独立数组，ui_app_dialog才成为当前应用接口；函数复制局部输入而不借用其寿命。
borrowed:
- component: G12生成的八套字体数据
  usage: 按fonts.lock.json固定来源和轴，font_atlas.py生成字形覆盖率，u_text借用只读数组；前端不是新的字体引擎。
feedback:
- source: 用户本轮连续教程要求
  observation: 基础语法、对象来源与状态寿命不能只由作者假设，界面应直接从新版设计逐步形成。
  revision: 本章按同一个具体操作承接，旁注解释当前值与局部表达式，正文追踪跨函数状态；共享字段在实际消费者出现时加入。
not_inferred: 已生成文档、运行观察通过、注释覆盖或前文已解释都不记录为已掌握；共享画像明确经历与本章解释范围分别维护。
