checkpoint: K38
baseline: baseline.yaml
start: K37
current_operation: 内核保留活对象，映射并接入64KiB新批次，达到1MiB上限后归还对象并核对缓存与借用
already_explained:
- concept: 堆backing与对象分别所有
  at: ../../../dev-log/core/17-kernel-heap.md#heap-backing
  establishes: 页面归堆，对象只借payload，free不自动归还物理页；块头32字节、对象16字节对齐
- concept: 分割与相邻合并
  at: ../../../dev-log/core/17-kernel-heap.md#heap-split
  establishes: 完整接回后继再发布分割，精确对象起点归还，合并恢复块头容量
- concept: 共享高半区的活动翻译
  at: ../../../dev-log/core/22-processes.md#shared-kernel-tlb
  establishes: 用户根借同一内核分支，map/unmap应失效当前CPU；本节不加入跨核协议
first_use:
- concept: 连续backing接入与末块状态
  at: ../../../dev-log/core/38-kernel-heap-growth.md#heap-extend-chain
  establishes: tail精确等于旧右端；空末块延长、活末块后建新块头，旧对象地址和容量保持
- concept: 缓存增长与净资源核对
  at: ../../../dev-log/core/38-kernel-heap-growth.md#heap-cache-usage
  establishes: 页池加堆数据页计数保持、活payload保持；当前1MiB上限在同一初始叶子表内
- concept: 扩展的两层提交与回滚
  at: ../../../dev-log/core/38-kernel-heap-growth.md#heap-grow-mapping
  establishes: 一批十六页由静态区域句柄持有，完整映射清零时仍未进入块链；两层分别提交与回滚，kmalloc有界重试
- concept: 会话采用缓存感知核对
  at: ../../../dev-log/core/38-kernel-heap-growth.md#heap-grow-callers
  establishes: launch三处及内核任务收尾共用same_usage，保留FD与栈回收边界
not_assumed:
- 通用malloc、slab、并发分配、自动收缩或Linux内存策略已经实现
limits:
- 初始64KiB，最多1MiB；启动演示将缓存实际增长到上限，backing持续持有
- 仍为单核不可抢占内核且IRQ不分配；未人为耗尽整机物理页
