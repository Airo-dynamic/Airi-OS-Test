checkpoint: 'K11'
baseline: baseline.yaml
start: '10'
current_operation: 为同一条UART命令选择串口实现，构建镜像并检查文本算法
already_explained:
- concept: 文本会话和真实启动输入
  at: ../../../dev-log/core/10-input.md#uart-input-path
  establishes: 设备字节进入逻辑键，回车后文本模型生成结果，主循环只发送本次新增输出
- concept: 符号、编译单元与链接
  at: ../../../dev-log/core/06-entry.md#elf-layout
  establishes: 编译器形成带定义和引用的对象文件，链接器将引用连接到所选定义并安排地址
- concept: Make目标与源文件变换
  at: ../../../dev-log/core/06-entry.md#make-rules
  establishes: SOURCES经patsubst形成对象路径，规则使用当前profile的独立目录生成ELF
first_use:
- concept: 架构提示函数
  at: ../../../dev-log/core/11-serial-build.md#arch-relax
  establishes: 通用循环调用普通C函数，x86实现执行pause后返回，仍是轮询而非睡眠调度
- concept: 同名显示实现的链接选择
  at: ../../../dev-log/core/11-serial-build.md#serial-display-link
  establishes: 默认只链接返回false的显示实现，UART发送仍由主循环完成；有效显示描述与完成绘图分别判断
- concept: 函数指针、void上下文与同步回调
  at: ../../../dev-log/core/11-serial-build.md#command-extension
  establishes: 函数地址保存调用签名，void指针只借用安装者的对象；NULL短路不调用，命令副本仅在本次execute期间有效
- concept: Make筛选、替换与条件包含
  at: ../../../dev-log/core/11-serial-build.md#serial-build-rules
  establishes: filter用desktop-%筛选profile，空结果跳过前端include；CASE移除前缀而OUT保留完整profile，MAKECMDGOALS限定可选动作规则
- concept: 主机断言与运行时检查
  at: ../../../dev-log/core/11-serial-build.md#host-checks
  establishes: assert失败中止主机程序；ASan和UBSan检查当前运行；fixture按值返回副本，4MiB可用内存在mem中显示4096KiB
borrowed:
- component: 主机libc、ASan与UBSan
  contract: libc作为字节和格式化结果的对照，运行时检查只作用于主机程序，不替代guest设备验证
not_inferred: 已解释、敲完和运行成功不证明学习者掌握。
