not_assumed:
- 完整stdlib、C23或全部POSIX语义、并发分配器、扩展对齐、自动增长收缩、pthread和C++ runtime
limits:
- 每进程单线程，单个按需256KiB arena，最大请求262096字节，增长可能因同时持有新旧块失败
- free保留arena直到进程退出或exec；无任意指针安全释放和越界保护承诺
