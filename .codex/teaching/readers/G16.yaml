checkpoint: G16
baseline: baseline.yaml
start: G15
current_operation: 排序Files六条快照并显示main.lua，服务id与屏幕行保持不同身份
already_explained:
- concept: 整屏窗口矩形与正文矩形
  at: ../../../dev-log/graphics/15-windows.md#window-coordinates
  establishes: ui_window.rect保存整屏像素，body扣48像素标题加顶边；外框(100,80,800,600)得到(101,129,798,550)。
first_use:
- concept: 可见行、快照下标与文件身份
  at: ../../../dev-log/graphics/16-files-editor-view.md#file-indices
  establishes: 默认order=[3,2,0,5,1,4]；order[0]=3取files[3]，再按该项id读取，索引排序不搬动元信息。
- concept: 编辑数组与保存点分别持有正文
  at: ../../../dev-log/graphics/16-files-editor-view.md#document-copies
  establishes: 服务read复制正文到editor；saved是另一数组，改editor不改变服务或saved；当前dirty为false。
- concept: 字节间隙、半开选区与行列转换
  at: ../../../dev-log/graphics/16-files-editor-view.md#cursor-gap
  establishes: ABCD有0..4五个间隙，[1,3)选BC；换行改变行列，cursor不能直接当屏幕x。ASCII限定后一个字节才是一字符。
- concept: 内容区域与应用各自布局
  at: ../../../dev-log/graphics/16-files-editor-view.md#editor-frame
  establishes: Editor正文在body顶下88px，Files首行在138px；u_selection用淡底加3px侧标，代码选区按10px字节宽。
- concept: 应用接口随实际消费者增长
  at: ../../../dev-log/graphics/16-files-editor-view.md#code-frontend-apps-internal-h-1
  establishes: 在保留当前辅助函数后加入Files/Editor绘图；点击与对话框随后首次使用时再加入。
borrowed:
- component: G12生成的八套字体数据
  usage: 按fonts.lock.json固定来源和轴，font_atlas.py生成字形覆盖率，u_text借用只读数组；前端不是新的字体引擎。
feedback:
- source: 用户本轮连续教程要求
  observation: 基础语法、对象来源与状态寿命不能只由作者假设，界面应直接从新版设计逐步形成。
  revision: 本章按同一个具体操作承接，旁注解释当前值与局部表达式，正文追踪跨函数状态；共享字段在实际消费者出现时加入。
not_inferred: 已生成文档、运行观察通过、注释覆盖或前文已解释都不记录为已掌握；共享画像明确经历与本章解释范围分别维护。
